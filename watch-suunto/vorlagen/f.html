<!-- Pumpfoil: Datenseite mit bis zu 6 Feldern (aus einem freien Layout des Profils: Werte in
     Lese-Reihenfolge, s. quelle/uhr.js anzeigen; Positionen kann eine SuuntoPlus-Vorlage nicht setzen) -->
<uiView>
  <div id="suuntoplus">
    <div class="cm-fg" style="width:100%;height:18%;">
      <div id="t" class="sp-t-s p-hc" style="top:calc(62% - 50%e);">PUMPFOIL</div>
    </div>
    <div id="v1" class="sp-d-s f-num" style="top:calc(30% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="l1" class="sp-t-s cm-mid" style="top:calc(38% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="v2" class="sp-d-s f-num" style="top:calc(30% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="l2" class="sp-t-s cm-mid" style="top:calc(38% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="v3" class="sp-d-s f-num" style="top:calc(50% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="l3" class="sp-t-s cm-mid" style="top:calc(58% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="v4" class="sp-d-s f-num" style="top:calc(50% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="l4" class="sp-t-s cm-mid" style="top:calc(58% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="v5" class="sp-d-s f-num" style="top:calc(70% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="l5" class="sp-t-s cm-mid" style="top:calc(78% - 50%e);left:calc(30% - 50%e);">-</div>
    <div id="v6" class="sp-d-s f-num" style="top:calc(70% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="l6" class="sp-t-s cm-mid" style="top:calc(78% - 50%e);left:calc(70% - 50%e);">-</div>
    <div id="s" class="sp-t-s sp-c-cyan p-hc" style="top:calc(90% - 50%e);">-</div>
  </div>
  <userInput>
    <pushButton name="up" onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');" />
    <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
  </userInput>
</uiView>
