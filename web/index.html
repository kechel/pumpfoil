              "name": "Was ist Pumpfoiling?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Pumpfoiling heisst, ein Hydrofoil ohne Wind, Welle oder Motor allein durch rhythmisches Auf- und Abbewegen des Boards in Fahrt zu halten. Der Antrieb kommt aus dem Koerper des Fahrers — jede dieser Bewegungen ist ein Pump."
              }

              "@type": "Question",
              "name": "Womit kann ich Pumpfoiling aufzeichnen?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Mit einer Garmin-Uhr (ueber 120 Modelle), einer Apple Watch, einer Wear-OS-Uhr oder einer Amazfit. Ohne Uhr geht es auch mit dem Handy. Wer eine Polar, Suunto, COROS oder Xiaomi nutzt, verknuepft sein Konto und die Sessions kommen automatisch an."

              }
            },

              "@type": "Question",
              "name": "Kostet Pumpfoil.org etwas?",
