# Sandbox fuer foil-server (Security-Review 29.10.2026, S-010).
# Ein Fehler im Server soll nicht an Jans ganzes Home kommen: das Dateisystem ist schreibgeschuetzt
# bis auf die Ordner, in die der Server wirklich schreibt (am 29.10. per Schreibprobe und einer
# Testinstanz auf Port 8099 geprueft). /tmp ist privat, neue Rechte (setuid) gibt es nicht.
#
# Installation (Drop-in, die eigentliche Unit bleibt unveraendert):
#   sudo mkdir -p /etc/systemd/system/foil-server.service.d
#   sudo cp deploy/foil-server.service.d/sandbox.conf /etc/systemd/system/foil-server.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart foil-server
#
# Schreibt der Server kuenftig in einen neuen Ordner ausserhalb von server/data und server/media,
# muss er hier unter ReadWritePaths dazu — sonst schlaegt das mit „Read-only file system" fehl.
[Service]
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/jan/garmin-connect-iq/server/data
ReadWritePaths=/home/jan/garmin-connect-iq/server/media
ReadWritePaths=/home/jan/.cache/fontconfig
ReadWritePaths=/home/jan/.cache/matplotlib
PrivateTmp=yes
NoNewPrivileges=yes
